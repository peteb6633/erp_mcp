name: Tests

# Lint and unit tests, including tests/test_traps.py, which fails if someone
# "tidies" code that docs/decisions/ records as deliberate.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q tests
